name: Watchdog

# Did the scheduled jobs actually run? GitHub drops scheduled runs under load
# (cron drift), which has silently frozen live scores and dropped a morning
# digest. This checks each watched workflow had a recent successful run and
# emails ONLY when one is overdue — silent when healthy.
on:
  schedule:
    # Daily 22:15 UTC = 08:15 AEST — after the 20:00 digest and 21:30 archive,
    # so a dropped morning run is caught the same morning.
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  actions: read # gh run list
  contents: read
  issues: write # open/update/close the ops alert issue (the email path 535s)

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same Gmail-SMTP-is-dead-from-Actions port as weekly-health.yml: app
      # passwords are rejected from datacenter IPs (535), so this job's email
      # half has been a no-op. Resend is a plain HTTPS POST, no nodemailer.
      - name: Check schedules, file an issue and email on a miss
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: node scripts/watchdog.mjs
