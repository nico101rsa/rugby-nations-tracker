name: Watchdog

# Did the scheduled jobs actually run? GitHub drops scheduled runs under load
# (cron drift), which has silently frozen live scores and dropped a morning
# digest. This checks each watched workflow had a recent successful run, then
# (scripts/watchdog.mjs has the reasoning):
#   1. re-dispatches any overdue workflow — the self-heal;
#   2. commits editorial/health/ops-status.{json,md}, the SILENT log the Claude
#      weekly review reads (only when it changed);
#   3. pages Nico on the "⚠️ Rugby Tracker ops alert" issue ONLY when a
#      user-facing job stays broken despite the re-run: still overdue on a run
#      after it was already re-run, or overdue on three runs in a row. Once per
#      outage, even if he closes the issue while it goes on.
# Editorial signals (repeat leads, model ladder, squad gaps) never page, and
# nothing here emails.
on:
  schedule:
    # Daily 22:15 UTC = 08:15 AEST / 09:15 AEDT — after the 20:00 digest and
    # 21:30 archive. In practice GitHub starts it 2-3.5h late (00:00-01:55 UTC
    # through Sep-Oct 2026), which is fine for a daily check.
    - cron: "15 22 * * *"
  workflow_dispatch:

# Own group on purpose (never share — see the other workflows): two watchdogs
# at once would both read the same ops-status.json and race the commit.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  actions: write # gh run list + gh workflow run (the self-heal re-dispatch)
  contents: write # commit editorial/health/ops-status.{json,md}
  issues: write # open/refresh/close the ops alert issue (the page tier only)

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check schedules, self-heal, write the ops status, page only on a persisting outage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watchdog.mjs
      # Nothing is triggered by this push: no workflow has a push trigger on
      # editorial/, and pushes made with GITHUB_TOKEN start no workflows anyway.
      #
      # continue-on-error: a red scheduled run emails Nico through GitHub's own
      # failure notice — the very ping this job exists to spare him. Losing one
      # status write is cheap by comparison: the next run works from the last
      # record that did land (a page a day later, or rarely one repeat ping).
      - name: Commit the ops status (only when it changed)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/health/ops-status.json editorial/health/ops-status.md
          git diff --cached --quiet && echo "No ops-status change" && exit 0
          git commit -m "Ops status $(TZ=Australia/Sydney date '+%F %H:%M %Z')"
          # Live-refresh commits race us (every ~12 min on match days), and one
          # retry can lose a second race. Only these two files are ours, so a
          # rebase is safe.
          for i in 1 2 3; do git push && exit 0; git pull --rebase --autostash; done; exit 1
