name: Generate team digests

on:
  schedule:
    # Daily 20:00 UTC = 06:00 AEST (07:00 AEDT) — editions carry the new
    # Sydney-local date, ready before the morning check of the app.
    - cron: "0 20 * * *"
    # Match-Saturday extras: kickoffs run 05:10–19:10 UTC (FT ≈ 07:00–21:00),
    # so these land fresh post-match news ~1–2h after each cluster of games.
    - cron: "0 8,12,17,22 * * 6"
  # Editing this file runs the digests once — a smoke test for the edit, and a
  # no-tooling manual lever for when GitHub's scheduler drops the 20:00 fire
  # (as on 2026-08-29, when the morning edition simply never ran). The cron
  # Worker now backstops those drops, but it dispatches THIS workflow, so a
  # push trigger that needs nothing but a commit stays worth having.
  push:
    branches: [main]
    paths: [".github/workflows/generate-digests.yml"]
  workflow_dispatch:

# Own group. Sharing "refresh-data" with the match refresh meant every
# Saturday pinger dispatch evicted the QUEUED digest run (GitHub keeps one
# pending run per group), so match-day digests never ran. Push races with
# live-score commits are handled in the publish step instead.
concurrency:
  group: digests
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test scripts/*.test.mjs

      # Also writes the "Around the world" roundup that closes every edition:
      # write, fact-check, at most one revision, then the top four survivors
      # (scripts/world-roundup.mjs) — cut from the twelve fact-checked
      # stories, never from the raw source pack; two to four extra calls.
      # Per-team lines end with novelty=new / revised / REPEAT_LEAD / n/a — the
      # novelty gate's verdict (scripts/novelty.mjs). REPEAT_LEAD means the
      # edition went out repeating a recent lead after one failed revision;
      # the run report and the watchdog carry the same flag.
      # Models (scripts/model-router.mjs, switched 2026-10-11 on the news
      # shadow test): Haiku 5.5 writes and fact-checks, Sonnet 5.5 reviews,
      # Gemini's free ladder is the fallback for every paid call. About
      # US$0.05 a run, US$5 a month. The DIGEST_*_MODEL repository variables
      # (unset = the router's defaults) swap a role's model without a code
      # change: any model priced in scripts/compare-digest-models.mjs, or
      # "gemini".
      - name: Generate 12 team editions (Haiku 5.5 + fact-check, Sonnet 5.5 review; Gemini fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_WRITER_MODEL: ${{ vars.DIGEST_WRITER_MODEL }}
          DIGEST_CHECKER_MODEL: ${{ vars.DIGEST_CHECKER_MODEL }}
          DIGEST_REVIEW_MODEL: ${{ vars.DIGEST_REVIEW_MODEL }}
          DIGEST_WORLD_MODEL: ${{ vars.DIGEST_WORLD_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::no model API key secret set — digest generation skipped"
            exit 0
          fi
          # The SDK is only needed for the paid models; Gemini uses fetch.
          if [ -n "$ANTHROPIC_API_KEY" ]; then npm install --no-save @anthropic-ai/sdk; fi
          node scripts/generate-digests.mjs

      # Fixture storylines (scripts/build-storylines.mjs -> storylines.json at
      # the site root): a headline and 4-6 beats for every unplayed game with a
      # tracked side in the next 14 days, written by the writer role and
      # fact-checked by the checker role from a pack of repo data plus the news
      # pool and one search per fixture. Cached by pack hash, so an unchanged
      # game costs nothing; a few cents a day at most. Log-only: a failure here
      # never costs the digests (continue-on-error, and the script itself
      # exits 0).
      - name: Fixture storylines (writer + fact-check; log-only)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_WRITER_MODEL: ${{ vars.DIGEST_WRITER_MODEL }}
          DIGEST_CHECKER_MODEL: ${{ vars.DIGEST_CHECKER_MODEL }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && ! node -e "require.resolve('@anthropic-ai/sdk')" 2>/dev/null; then
            npm install --no-save @anthropic-ai/sdk
          fi
          node scripts/build-storylines.mjs

      # News-source candidates the review proposed (editorial/source-candidates
      # .{json,md}): find each outlet's feed and count its stories about the
      # tracked teams. No model calls, a dozen fetches at most, never fails the
      # run; the weekly review reads the result. Nothing is added to the spine
      # by code.
      - name: Probe news-source candidates
        continue-on-error: true
        run: node scripts/probe-source-candidates.mjs

      - name: Publish nations.json at site root
        run: cp public/nations.json nations.json

      # After the editions exist, not before — the email reports on the run.
      # Skips itself when RESEND_API_KEY is unset, and never fails the job: the
      # briefings are already written by this point and a mail problem must not
      # cost them.
      - name: Email the daily briefings
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Recipient is a SECRET, not a variable: this repo is public, so its
          # workflow logs are public, and a variable would put Nico's personal
          # address in them. As a secret, Actions masks it in any log output.
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DIGEST_EMAIL_FROM: ${{ vars.DIGEST_EMAIL_FROM }}
        run: node scripts/email-digests.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nations.json public/nations.json editorial/ storylines.json
          git diff --cached --quiet && echo "No digest changes" && exit 0
          git commit -m "Daily digests $(TZ=Australia/Sydney date '+%F %H:%M %Z')"
          if git push; then exit 0; fi
          # A live-score commit raced us. Both sides rewrite nations.json
          # wholesale, so a rebase would conflict — instead rebuild on top of
          # origin: keep their fresh scores, re-apply our digests block and
          # editorial output (only digest runs write editorial/).
          cp public/nations.json /tmp/digests-ours.json
          # The root storylines.json is authored here and nowhere else.
          cp storylines.json /tmp/storylines-ours.json 2>/dev/null || true
          # Snapshot only what THIS workflow authors. The news pool is written
          # hourly by harvest-news.yml, so restoring the whole editorial/ dir
          # wholesale would silently revert any harvest that landed during the
          # ~10 minutes this run spends on 12 model calls.
          # editorial/health/ is NOT ours: the weekly health check, the
          # watchdog's ops-status.{json,md} and the Claude weekly review write
          # it. Snapshotting it here put this run's stale copy back over theirs
          # on every push race — losing a heal record, which delays a page by
          # a day. The watchdog lands ~00:00-02:00 UTC, inside the late digest
          # runs' window, so the race is real.
          rm -rf /tmp/editorial-ours && mkdir -p /tmp/editorial-ours
          cp -R editorial/reviews editorial/runs /tmp/editorial-ours/ 2>/dev/null || true
          # storylines.json is authored HERE (the quiet-day backlog) and carries
          # the use counts. Omitting it from this snapshot would silently revert
          # the day's backlog update on any push race.
          # world-notes.md is the roundup's standing notes, written by the same
          # review — leaving it out of the snapshot would revert the day's
          # roundup notes on any push race.
          # source-candidates.{json,md} are the review's outlet proposals and
          # the probe's counts, written here and nowhere else.
          cp editorial/editor-notes.md editorial/checker-notes.md editorial/world-notes.md editorial/storylines.json editorial/source-candidates.json editorial/source-candidates.md /tmp/editorial-ours/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          node -e '
            const fs = require("fs");
            const fresh = JSON.parse(fs.readFileSync("public/nations.json", "utf8"));
            const ours = JSON.parse(fs.readFileSync("/tmp/digests-ours.json", "utf8"));
            fresh.digests = ours.digests;
            const payload = JSON.stringify(fresh, null, 2);
            fs.writeFileSync("public/nations.json", payload);
            fs.writeFileSync("nations.json", payload);
          '
          # Copy our own output back over origin's tree, leaving origin's
          # news-pool.json (and anything else we do not author) intact.
          cp -R /tmp/editorial-ours/. editorial/
          cp /tmp/storylines-ours.json storylines.json 2>/dev/null || true
          git add nations.json public/nations.json editorial/ storylines.json
          git commit -m "Daily digests $(TZ=Australia/Sydney date '+%F %H:%M %Z') (reapplied over live refresh)"
          git push || (git pull --rebase --autostash && git push)
