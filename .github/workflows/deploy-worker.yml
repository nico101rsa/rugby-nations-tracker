name: Deploy cron worker

# Deploys the Cloudflare Worker that dispatches refresh-data.yml (app map
# #196). Runs from Actions rather than Nico's Mac, per the standing cloud-first
# directive: the whole point of this Worker is that it survives the Mac being
# asleep for months, so deploying it from that Mac would be an odd place to
# start.
#
# Deploys only when the worker actually changes, plus on demand.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

# Own group — never share (a shared group once starved queued digest runs).
concurrency:
  group: deploy-cron-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The Cloudflare secrets are Nico's to create, so between this workflow
      # landing and him setting them every push to worker/ would hard-fail and
      # email him a red run — training him to ignore exactly the channel the
      # alerting depends on. Skip with a notice instead, and say what is
      # missing. It goes green the moment the secrets exist.
      - name: Skip unless the deploy secrets exist
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$DISPATCH" ] && missing="$missing GH_DISPATCH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice::Cron Worker not deployed — missing secret(s):$missing. Setup steps are in worker/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - name: Deploy to Cloudflare
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Push the dispatch token as a Worker secret on every deploy, so
          # rotating it is a one-line `gh secret set` here rather than a
          # separate wrangler session on the Mac.
          secrets: |
            GITHUB_DISPATCH_TOKEN
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
