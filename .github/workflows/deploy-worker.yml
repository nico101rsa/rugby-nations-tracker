name: Deploy cron worker

# Deploys the Cloudflare Worker that dispatches refresh-data.yml (app map
# #196). Runs from Actions rather than Nico's Mac, per the standing cloud-first
# directive: the whole point of this Worker is that it survives the Mac being
# asleep for months, so deploying it from that Mac would be an odd place to
# start.
#
# Deploys only when the worker actually changes, plus on demand.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

# Own group — never share (a shared group once starved queued digest runs).
concurrency:
  group: deploy-cron-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The Cloudflare secrets are Nico's to create, so between this workflow
      # landing and him setting them every push to worker/ would hard-fail and
      # email him a red run — training him to ignore exactly the channel the
      # alerting depends on. Skip with a notice instead, and say what is
      # missing. It goes green the moment the secrets exist.
      - name: Skip unless the deploy secrets exist
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$DISPATCH" ] && missing="$missing GH_DISPATCH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice::Cron Worker not deployed — missing secret(s):$missing. Setup steps are in worker/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      # TWO STEPS ON PURPOSE. wrangler-action uploads `secrets:` BEFORE it
      # deploys, and a secret cannot be set on a Worker script that does not
      # exist yet — the very first deploy died on exactly that, with the
      # unhelpful "Could not route to .../secrets-bulk, perhaps your object
      # identifier is invalid? [code: 7003]" (run 30151009461). So: create the
      # script first, then push the secret and redeploy. Deploying does not
      # clear existing secrets, so this stays correct on every later run too.
      - name: Create/update the Worker
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # wrangler-action@v3 defaults to wrangler 3.90.0, which CANNOT READ
          # wrangler.jsonc — JSON config arrived in wrangler 4. On 3.90 it finds
          # no config at all and fails with the misleading "Required Worker name
          # missing", as it did on the first real deploy (run 30150966895).
          wranglerVersion: "4"
          command: deploy

      - name: Push the dispatch token and redeploy
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4"
          # Pushed on every deploy, so rotating the token is a one-line
          # `gh secret set` here rather than a separate wrangler session.
          secrets: |
            GITHUB_DISPATCH_TOKEN
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
