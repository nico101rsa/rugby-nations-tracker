name: Weekly health check

# Thursday health check: commits a dated report to editorial/health/<week>.md.
# Covers run reliability, the silent-failure checks, digest quality grades, and
# what changed this week; points to the manual checks (app analytics, App
# Store review status) that a headless job can't reach.
#
# SILENT by default (2026-10-04). Nico asked for the weekly review to be done
# by Claude rather than by him, so this no longer files a "🩺 weekly health
# check" issue or emails: the scheduled Claude weekly review reads the newest
# editorial/health/<week>.md (and ops-status.md beside it) and escalates only
# what needs him.
#
# Email is opt-in: set the repository VARIABLE HEALTH_EMAIL to "1"
# (Settings → Secrets and variables → Actions → Variables) to get the report
# by email as well. It goes over the Resend HTTP API, which works from Actions
# (Gmail SMTP app-passwords are rejected from datacenter IPs with a 535).
on:
  schedule:
    # Wed 21:00 UTC = Thu 07:00 AEST / 08:00 AEDT.
    - cron: "0 21 * * 3"
  workflow_dispatch:

permissions:
  actions: read # gh run list
  contents: write # commit the report

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git log --since needs history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test scripts/*.test.mjs
      - name: Build the report (email only if HEALTH_EMAIL is "1")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_EMAIL: ${{ vars.HEALTH_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: node scripts/health-report.mjs
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/health/
          git diff --cached --quiet && echo "No report change" && exit 0
          git commit -m "Weekly health check $(TZ=Australia/Sydney date '+%G-W%V')"
          # Live-refresh commits race us; only editorial/health/ is ours, so a
          # rebase is safe.
          git push || (git pull --rebase --autostash && git push)
