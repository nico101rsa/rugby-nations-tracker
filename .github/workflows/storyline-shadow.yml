name: Storyline shadow (model comparison)

# The same fixture packs written by several models and fact-checked by
# production's checker, recorded to editorial/shadow-storylines/<stamp>.{json,md}
# for an editorial read of quality against price (scripts/storyline-shadow.mjs).
# Publishes nothing the app reads. Costs real money: about US$3–5 for seven
# fixtures on the five default writers, bounded by the script's cap.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Writers, comma-separated: gemini, or a model priced in scripts/compare-digest-models.mjs"
        default: "gemini,claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5,claude-fable-5-1"
      days:
        description: "Fixture window, days"
        default: "20"
      fixture:
        description: "One fixture only (fixtures.json id or HOME-AWAY); blank for all"
        default: ""
      cap:
        description: "Spend cap for the run, US$"
        default: "8"
      voice:
        description: "Writer brief: preview, dry or dry2, or a comma-separated list to set briefs side by side; blank for production's"
        default: ""
  # A push to a claude/* branch that touches the harness runs it once on that
  # branch — a smoke run for the edit, and the only lever a cloud Claude
  # session has: it cannot dispatch a workflow (GitHub answers 403) but it
  # can push. The results commit back to the same branch with GITHUB_TOKEN,
  # which never triggers a push workflow, so the run cannot loop. Pushes to
  # main never run it; use the dispatch. A push carries its inputs as commit
  # trailers on the head commit (Shadow-Models:, Shadow-Days:, Shadow-Cap:,
  # Shadow-Fixture:, Shadow-Voice:), the same values the dispatch form takes.
  # Absent, a push runs ONE writer (Opus 5.5) under a US$1 cap: a smoke run
  # for the edit, not a comparison. The dispatch form keeps the full
  # defaults. (The push of #173 touched the harness, carried no trailers and
  # ran all five writers on seven fixtures: US$2.23 nobody had asked for.)
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/storyline-shadow.mjs"
      - "scripts/build-storylines.mjs"
      - ".github/workflows/storyline-shadow.yml"

concurrency:
  group: storyline-shadow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests for the harness and the pack
        run: node --test scripts/build-storylines.test.mjs scripts/rankings-stakes.test.mjs scripts/storyline-shadow.test.mjs scripts/host-overrides.test.mjs

      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk

      - name: Shadow run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_CHECKER_MODEL: ${{ vars.DIGEST_CHECKER_MODEL }}
          IN_MODELS: ${{ inputs.models }}
          IN_DAYS: ${{ inputs.days }}
          IN_FIXTURE: ${{ inputs.fixture }}
          IN_CAP: ${{ inputs.cap }}
          IN_VOICE: ${{ inputs.voice }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret not set — nothing to compare"
            exit 1
          fi
          # On a push, the head commit's trailers stand in for the dispatch inputs.
          trailer() { git log -1 --pretty=%B | sed -n "s/^$1:[[:space:]]*//p" | tail -1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            IN_MODELS="$(trailer Shadow-Models)"; IN_DAYS="$(trailer Shadow-Days)"; IN_CAP="$(trailer Shadow-Cap)"; IN_FIXTURE="$(trailer Shadow-Fixture)"; IN_VOICE="$(trailer Shadow-Voice)"
            # No trailers: a smoke run, one writer under a dollar (see above).
            IN_MODELS="${IN_MODELS:-claude-opus-5-5}"; IN_CAP="${IN_CAP:-1}"
          fi
          ARGS="--models ${IN_MODELS:-gemini,claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5,claude-fable-5-1} --days ${IN_DAYS:-20} --cap ${IN_CAP:-8}"
          if [ -n "$IN_FIXTURE" ]; then ARGS="$ARGS --fixture $IN_FIXTURE"; fi
          if [ -n "$IN_VOICE" ]; then ARGS="$ARGS --voice $IN_VOICE"; fi
          echo "running: node scripts/storyline-shadow.mjs $ARGS"
          node scripts/storyline-shadow.mjs $ARGS

      - name: Commit the records to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/shadow-storylines
          git diff --cached --quiet && echo "nothing recorded" && exit 0
          git commit -m "Storyline shadow run $(TZ=Australia/Sydney date '+%F %H:%M %Z')"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
