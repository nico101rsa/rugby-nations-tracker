# Read-only SportsAPI Pro health check — see scripts/vendor-probe.mjs for why.
# Four vendor calls a night (2 teams x last/next), writes only the probe log,
# never team-events.json. Files an assigned issue at three dead nights.
name: Vendor probe

on:
  schedule:
    # Nightly 09:45 UTC = 19:45 AEST, matching the hour the 23 Aug probe ran
    # so the readings are comparable night to night.
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit the probe log
  issues: write # the escalation issue at three dead nights

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe the vendor
        env:
          SPORTSAPIPRO_KEY: ${{ secrets.SPORTSAPIPRO_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/vendor-probe.mjs

      - name: Commit the probe log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor-probe-log.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Vendor probe $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
