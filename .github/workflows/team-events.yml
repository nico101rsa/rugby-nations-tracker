name: Team events

# Each nation's recent internationals + upcoming fixtures across ALL
# competitions -> team-events.json. Daily at 01:00 UTC, plus a Saturday
# 19:00 UTC run so match-day results reach the Team pages the same night
# (Sat games finish ~17:20 UTC; the daily run alone left them stale until
# Sunday afternoon AEST). Each run is ~25 SportsAPI Pro calls paced under
# the 10/min ceiling; worst-case Saturday (2 runs + stats harvest's ~5-18
# calls, 20:30 UTC, same key) still clears the shared 100/day free tier.
# (Saturday live polling is api-sports — a different vendor — so this job
# never competes with it.)
#
# That Saturday slot is tuned to Northern-Hemisphere kickoffs, so games that
# finish far from it — Asia-Pacific tests, ~07:00 UTC — waited up to ~12h to
# reach the Team pages. team-events-catchup.yml closes that gap by re-fetching
# only the teams that just played; this job stays the full, authoritative walk.
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 19 * * 6"
  workflow_dispatch:

# Own group on purpose — never share concurrency groups (see repo history).
concurrency:
  group: team-events-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  team-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch team events from SportsAPI Pro
        env:
          SPORTSAPIPRO_KEY: ${{ secrets.SPORTSAPIPRO_KEY }}
        run: node scripts/fetch-team-events.mjs

      - name: Archive games into team-events-archive.json
        run: node scripts/archive-team-events.mjs

      # Rebuild the registry daily, not just weekly. build-fixtures reads it,
      # and a seeded competition must retire within a DAY of the vendor
      # publishing real fixtures rather than sitting alongside them for a week.
      # Keyless ESPN calls, so this costs no quota. The weekly watcher still
      # owns raising an issue when a competition first appears.
      - name: Rebuild competitions.json (registry + structure classifier)
        run: node scripts/build-competitions.mjs

      - name: Build fixtures.json (match-level upcoming list, keyless ESPN)
        run: node scripts/build-fixtures.mjs

      # Daily integrity check on what the app is actually being shown. Catches
      # the class Nico found by opening TestFlight — Six Nations 2026 finished
      # in March and was still on offer in the dropdown in late July, with
      # nothing anywhere noticing. Asserts: nothing expired is the default,
      # fixture counts match their classified shape (arithmetic), the registry
      # and fixtures.json agree, and each structure still holds against its own
      # published fixtures. Raises a GitHub issue, never fails the build — the
      # data is already published by this point.
      - name: Check competition integrity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-competitions.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-events.json team-events-archive.json fixtures.json competitions.json
          git diff --cached --quiet && echo "No team-events changes" && exit 0
          git commit -m "Team events refresh $(TZ=Australia/Sydney date '+%F %H:%M AEST')"
          git push || (git pull --rebase --autostash && git push)
