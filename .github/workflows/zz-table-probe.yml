# One-off probe (13 Nov 2026): the shape of two published tables, read once so
# the table cross-check is built against real payloads. Deleted before merge.
name: Table source probe
on:
  push:
    branches: [claude/sharp-fermat-okr7fo]
    paths: [".github/workflows/zz-table-probe.yml", "scripts/zz-table-probe.mjs"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          RUGBY_API_KEY: ${{ secrets.RUGBY_API_KEY }}
        run: node scripts/zz-table-probe.mjs
